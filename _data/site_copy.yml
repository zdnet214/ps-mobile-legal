        body: 一张照片按行 × 列等分成小块，1 到 8 任选，切片写回相册的独立目录。
      - title: HDR 合成
        body: 同一场景 2 到 5 张不同曝光合成一张；整组都是 RAW 时输出 16 位线性 DNG，保留高光。
      - title: 调整
        body: 基础、色彩、效果、蒙版、色阶、曲线六组参数，可存为预设复用到其他照片。
      - title: 堆栈
        body: 同机位多张合成，平均值、中位数或最大值，用来降噪、叠星轨或去掉移动的人。
      - title: 全景拼接
        body: 按拍摄顺序拼接有重叠的几张，自动判断投影与接缝，另有高分辨率档。
      - title: 景深合成
        body: 近景、中景、远景分别对焦，合成一张处处清晰的照片。
