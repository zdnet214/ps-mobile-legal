    title: 「不联网」是可以核对的
    items:
      - release 安装包不声明 INTERNET 权限，装好后可以在系统的「应用信息」里看到它没有任何联网权限。
      - RAW 解码、HDR、全景、堆栈、景深与调整都由随包的原生库在这台设备上完成，处理过程不经过服务器。
      - 应用启动时会核对自身签名，被重新签名的包会直接停在提示页，改过的 APK 无法冒充官方版本。
