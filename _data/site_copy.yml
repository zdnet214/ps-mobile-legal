en:
  locale: en
  legal_locale: en
  language_switch:
    label: 简体中文
    url: /
  hero:
    name: Pixel Studio
    latin: 像素工坊
    tagline: On-device · Offline · Nothing uploaded
    intro: Pick photos from your gallery and split, merge, decode, stitch, stack or adjust them on the phone itself. The release build declares no network permission, so your photos never leave the device.
    download: Download APK
    download_hint: Android 10 or newer · arm64
    latest: Always the latest build
  download:
    title: Current release
    version: Version
    build: Build
    size: Size
    sha256: SHA-256
    abi: ABI
    min_android: Minimum Android
    released: Released
    verify: After downloading, compare your file's SHA-256 with the value shown here before installing.
  capabilities:
    title: Six tools, all running on the phone
    items:
      - title: Split
        body: Cut one photo into an equal grid of rows and columns, 1 to 8 each, saved into their own gallery folder.
      - title: HDR merge
        body: Merge 2 to 5 exposures of one scene; a bracket of RAWs becomes a 16-bit linear DNG that keeps the highlights.
      - title: Adjust
        body: Basic, colour, effects, masks, levels and curves, with presets that carry the look to other photos.
      - title: Stack
        body: Combine frames from one position with mean, median or maximum to cut noise, stack star trails or drop moving people.
      - title: Panorama
        body: Stitch overlapping frames in shooting order, with automatic projection and seams, plus a high-resolution mode.
      - title: Focus stack
        body: Focus near, middle and far, then fuse them into one frame that is sharp everywhere.
  offline:
    title: "“Offline” is something you can check"
    items:
      - The release APK declares no INTERNET permission — after installing, the system's app info screen shows it holds no network permission at all.
      - RAW decoding, HDR, panorama, stacking, focus and adjustment all run in the native libraries that ship inside the app; no step goes through a server.
      - The app checks its own signing certificate at launch; a re-signed build stops on a blocking screen, so a modified APK cannot pass as the official one.
  install:
    title: Install in three steps
    steps:
      - Download the APK with the button above, and check that the size and SHA-256 match what this page shows.
      - Open the downloaded file; if the system asks, allow your browser to install unknown apps.
      - Launch from the home screen. Play Protect may warn about an unrecognised app — that is because the build comes from this site, not from a store.
      - This build never updates itself; come back here for a new version. Installing over the old one keeps your data.
  faq:
    title: Common questions
    items:
      - q: Will it replace a Google Play install?
        a: No, the two cannot overwrite each other. Google Play re-signs the app with its own certificate, so the store build and this one count as different sources; uninstall the store copy first. In-app data is cleared, photos in the gallery are not affected.
      - q: Does it update itself?
        a: No. The app has no network permission, so there is no update check; come back here for a new version. Installing over the old one keeps your data.
      - q: Which devices are supported?
        a: Android 10 or newer on arm64. Only the arm64 build is published here; the x86_64 build exists for emulators and is not offered.
