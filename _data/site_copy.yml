      - q: 会自动更新吗？
        a: 不会。应用没有网络权限，也就没有更新检查；新版本需要回到本站重新下载，覆盖安装不会清除已有数据。
      - q: 对设备和系统有什么要求？
        a: Android 10 及以上、arm64 设备。本站只提供真机使用的 arm64 包，模拟器用的 x86_64 包不上站。
